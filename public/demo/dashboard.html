<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Intelligence Dashboard · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>

/* Layout: screen picker on top, then one desktop window (1240×870, scaled to fit) showing the chosen screen.
   The app itself uses one fixed look (style A, matches the portfolio); the page around it follows the viewer theme. */
:root {
  --page-bg: #f3f3f0; --page-fg: #1b1c20; --page-muted: #6b6d75; --page-line: #d9d9d4; --page-accent: #2c42f6; --page-card: #ffffff;
  --ui: "Schibsted Grotesk", -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg: #15161a; --page-fg: #ececef; --page-muted: #9a9ca5; --page-line: #2c2e35; --page-accent: #8c9bff; --page-card: #1d1f24; color-scheme: dark; } }
:root[data-theme="dark"] { --page-bg: #15161a; --page-fg: #ececef; --page-muted: #9a9ca5; --page-line: #2c2e35; --page-accent: #8c9bff; --page-card: #1d1f24; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--page-bg); color: var(--page-fg); font-family: var(--ui); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 48px; display: grid; gap: 18px; }
.intro h1 { font-size: 22px; font-weight: 500; margin: 0 0 6px; }
.intro p { margin: 0; color: var(--page-muted); max-width: 70ch; line-height: 1.5; }
.picker { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { all: unset; cursor: pointer; padding: 8px 14px; border: 1px solid var(--page-line); border-radius: 999px; background: var(--page-card); font-size: 14px; }
.pick[aria-pressed="true"] { border-color: var(--page-accent); color: var(--page-accent); box-shadow: 0 0 0 1px var(--page-accent) inset; }
.pick:focus-visible { outline: 2px solid var(--page-accent); outline-offset: 2px; }
.stage { position: relative; width: 100%; overflow: hidden; border-radius: 12px; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 12px 40px rgb(0 0 0 / .10); }
.note { font-size: 12.5px; color: var(--page-muted); margin: 0; }

/* ---------- the app (style A) ---------- */
.app {
  --bg: #f6f6f3; --surface: #ffffff; --fg: #17181c; --muted: #6e7079; --faint: #9a9ca4; --line: #e3e3de; --line-soft: #ededea;
  --accent: #2c42f6; --accent-soft: #e9ecff; --hi: #d7ff3a; --lose: #b9bcc6; --good: #1a7f4b; --good-soft: #e5f3ea; --warn: #a15c07; --warn-soft: #fbefdc;
  --chip: #f1f1ee; --r: 10px;
  --f: "Schibsted Grotesk", -apple-system, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  width: 1240px; height: 870px; transform-origin: 0 0; display: grid; grid-template-columns: 232px 1fr;
  font-family: var(--f); color: var(--fg); background: var(--bg); font-size: 13.5px; line-height: 1.4;
}
.side { border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; flex: none; }
.logo svg { width: 15px; height: 15px; }
.brand b { font-weight: 600; font-size: 13px; line-height: 1.2; }
.brand small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; }
.ws { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-size: 12.5px; }
.ws small { color: var(--muted); font-size: 11.5px; display: block; font-weight: 400; }
.navgroup { display: grid; gap: 2px; }
.navgroup h6 { margin: 0 0 4px; padding: 0 10px; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.nav { all: unset; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--fg); cursor: pointer; }
.nav[disabled] { cursor: default; color: var(--faint); }
.nav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; opacity: .8; flex: none; }
.nav:not([disabled]):not(.on):hover { background: var(--line-soft); }
.nav.on { background: var(--surface); box-shadow: 0 0 0 1px var(--line); color: var(--accent); font-weight: 500; }
.nav:focus-visible { outline: 2px solid var(--accent); }
.side .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.main { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; border-bottom: 1px solid var(--line); min-height: 57px; }
.crumbs { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.crumbs b { color: var(--fg); font-weight: 500; }
.tabs { display: flex; gap: 4px; }
.tab { padding: 6px 10px; border-radius: 8px; color: var(--muted); font-size: 13px; }
.tab.on { background: var(--chip); color: var(--fg); font-weight: 500; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 500; font-size: 12.5px; white-space: nowrap; }
.btn.ghost { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line) inset; }
.btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.topr { display: flex; gap: 8px; align-items: center; }
.content { padding: 22px 24px; overflow: hidden; min-height: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.pad { padding: 14px 16px; }
.eyebrow { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
h2.title { margin: 0; font-weight: 500; font-size: 24px; letter-spacing: -.01em; }
h3.sec { margin: 0; font-size: 14px; font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip b { color: var(--fg); font-weight: 500; }
.chip.blue { background: var(--accent-soft); color: var(--accent); }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
mark { background: var(--hi); color: inherit; padding: 0 2px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.win { background: var(--good-soft); color: var(--good); }
.pill.mid { background: var(--chip); color: var(--muted); }
.pill.low { background: var(--warn-soft); color: var(--warn); }
.conf { display: inline-flex; gap: 3px; align-items: center; }
.conf i { width: 5px; height: 10px; border-radius: 1px; background: var(--line); display: inline-block; }
.conf i.f { background: var(--good); }
.pri { font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.pri.p2 { background: var(--chip); color: var(--muted); }

/* shared additions */
.tghead { display: flex; justify-content: space-between; align-items: baseline; }
.confh { font-size: 11px; color: var(--muted); }
/* overview */
.ov { display: grid; gap: 14px; }
.hello { display: flex; justify-content: space-between; align-items: end; }
.hello h2 { margin: 4px 0 0; font-size: 26px; font-weight: 500; letter-spacing: -.01em; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi { padding: 14px 16px; display: grid; gap: 4px; }
.kpi .n { font-size: 26px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12.5px; }
.flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.step { padding: 14px 16px; display: grid; gap: 5px; position: relative; border-right: 1px solid var(--line); }
.step:last-child { border-right: 0; }
.step .num { font-family: var(--mono); font-size: 11px; color: var(--accent); }
.step b { font-size: 14.5px; font-weight: 600; }
.step p { margin: 0; color: var(--muted); font-size: 12.5px; }
.step .st { margin-top: 6px; font-size: 12px; }
.step .arrow { position: absolute; right: -9px; top: 50%; width: 17px; height: 17px; background: var(--surface); border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; z-index: 1; font-size: 10px; color: var(--muted); transform: translateY(-50%); }
.two { display: grid; grid-template-columns: 1.35fr 1fr; gap: 12px; }
.latest { padding: 16px; display: grid; gap: 10px; }
.latest p { margin: 0; font-size: 16px; line-height: 1.5; font-weight: 500; }
.act { list-style: none; margin: 0; padding: 4px 16px; }
.act li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
.act li:last-child { border-bottom: 0; }
.act .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--chip); display: grid; place-items: center; }
.act .ic svg { width: 14px; height: 14px; stroke: var(--fg); fill: none; stroke-width: 1.7; }
.loop { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); font-size: 12.5px; }
.loop svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 1.6; flex: none; }

/* tagging */
.tg { display: grid; grid-template-columns: 250px 300px 1fr; gap: 14px; height: 100%; min-height: 0; }
.stepper { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.stepper .s { display: flex; gap: 6px; align-items: center; }
.stepper .d { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 10.5px; font-family: var(--mono); background: var(--surface); }
.stepper .s.done .d { background: var(--accent); border-color: var(--accent); color: #fff; }
.stepper .s.cur { color: var(--fg); font-weight: 500; }
.stepper .s.cur .d { border-color: var(--accent); color: var(--accent); }
.stepper .ln { width: 22px; height: 1px; background: var(--line); }
.queue { display: grid; align-content: start; overflow: hidden; }
.queue .qh { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.qi { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); align-items: center; }
.qi.sel { background: var(--accent-soft); }
.thumb { width: 34px; height: 48px; border-radius: 5px; background: linear-gradient(170deg, var(--t1), var(--t2)); }
.qi b { font-family: var(--mono); font-weight: 500; font-size: 11.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qi span { font-size: 11.5px; color: var(--muted); }
.qi .run { color: var(--accent); }
.prog { height: 4px; border-radius: 2px; background: var(--line-soft); overflow: hidden; margin-top: 4px; }
.prog i { display: block; height: 100%; width: 62%; background: var(--accent); }
.player { display: grid; gap: 10px; align-content: start; }
.vid { position: relative; aspect-ratio: 9/16; max-height: 520px; border-radius: var(--r); overflow: hidden; background: linear-gradient(180deg, #b9c6ff 0%, #dfe4ff 38%, #ffe2cf 72%, #fff3e4 100%); box-shadow: inset 0 0 0 1px rgb(23 24 28 / .06); }
.vid .isle { position: absolute; border-radius: 50% 50% 46% 54%; background: linear-gradient(180deg, #a7b2ee, #8a97dc); opacity: .9; }
.vid .sail { position: absolute; left: 42%; top: 54%; width: 34px; height: 30px; background: #f6f6f3; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.vid .dmg { position: absolute; left: 14%; top: 22%; font: 600 34px/1 var(--f); color: var(--accent); text-shadow: 0 0 14px rgb(255 255 255 / .95), 0 0 2px #fff; letter-spacing: -.02em; }
.vid .cap { position: absolute; left: 10%; right: 10%; bottom: 14%; background: rgb(255 255 255 / .9); color: var(--fg); box-shadow: 0 1px 4px rgb(23 24 28 / .08); border-radius: 6px; padding: 6px 8px; font-size: 12px; text-align: center; }
.vid .tc { position: absolute; left: 10px; top: 10px; font-family: var(--mono); font-size: 11px; color: var(--fg); background: rgb(255 255 255 / .8); padding: 2px 6px; border-radius: 4px; }
.scrub { display: grid; gap: 6px; }
.scrub .bar { position: relative; height: 26px; border-radius: 6px; background: var(--line-soft); overflow: hidden; display: flex; }
.scrub .bar span { height: 100%; display: flex; align-items: center; padding-left: 6px; font-size: 10.5px; color: #fff; white-space: nowrap; overflow: hidden; }
.scrub .lab { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.tags { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; overflow: hidden; }
.tags .th { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tgroups { padding: 4px 16px; overflow: hidden; }
.tgroup { padding: 10px 0; border-bottom: 1px solid var(--line-soft); display: grid; gap: 6px; }
.tgroup h5 { margin: 0 0 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.tr { display: grid; grid-template-columns: 120px 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; }
.tr .k { color: var(--muted); }
.tv { display: inline-flex; gap: 6px; align-items: center; padding: 3px 8px; border-radius: 6px; background: var(--chip); font-weight: 500; justify-self: start; }
.tv.edited { box-shadow: 0 0 0 1px var(--accent) inset; background: var(--accent-soft); }
.why { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--bg); font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.why b { color: var(--fg); font-weight: 500; }
.tags .tf { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }

/* library */
.lib { display: grid; gap: 14px; }
.lh { display: flex; justify-content: space-between; align-items: end; gap: 16px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; }
.fchip b { font-weight: 500; }
.fchip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg span { padding: 5px 10px; font-size: 12.5px; color: var(--muted); }
.seg span.on { background: var(--chip); color: var(--fg); font-weight: 500; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.t td { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t td.num, .t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.t .nm { display: flex; gap: 10px; align-items: center; }
.t .nm .thumb { width: 24px; height: 34px; border-radius: 4px; }
.t tr.sel td { background: var(--accent-soft); }
.tagc { display: inline-block; padding: 2px 7px; border-radius: 5px; background: var(--chip); font-size: 12px; }
.spk { display: inline-block; vertical-align: middle; }
.libfoot { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }

/* insights */
.ins { display: grid; grid-template-columns: 1fr 290px; gap: 20px; }
.report { display: grid; gap: 14px; align-content: start; min-width: 0; }
.rh { display: grid; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.verdict .k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); padding-top: 3px; }
.verdict p { margin: 0; font-size: 15px; line-height: 1.5; font-weight: 500; }
.legend { display: flex; justify-content: space-between; align-items: baseline; }
.legend .keys { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend .keys > span > i:only-child { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .keys .conf { margin-right: 6px; vertical-align: -1px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dcard { padding: 14px 16px; display: grid; gap: 10px; }
.ch { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ch b { font-weight: 600; }
.row { display: grid; grid-template-columns: 52px 112px 1fr 34px; align-items: center; gap: 10px; font-size: 12.5px; }
.row .who { color: var(--muted); font-size: 11.5px; }
.lab { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dbar { position: relative; height: 8px; border-radius: 5px; background: var(--line-soft); overflow: hidden; }
.dbar span { position: absolute; inset: 0 auto 0 0; border-radius: 5px; }
.dbar.w span { background: var(--accent); } .dbar.l span { background: var(--lose); }
.pct { text-align: right; font-family: var(--mono); font-size: 12px; }
.dcard p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.rail { display: grid; gap: 12px; align-content: start; }
.rail h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
.big { font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.big small { font-size: 13px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.spark svg { width: 100%; height: 78px; display: block; }
.spark text { font-size: 10px; fill: var(--muted); font-family: var(--mono); }
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
.list li { display: flex; gap: 8px; align-items: baseline; line-height: 1.4; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.cta { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r); border: 1px dashed var(--accent); color: var(--accent); font-size: 12.5px; font-weight: 500; }
.cta svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; flex: none; }

/* script studio */
.ss { display: grid; grid-template-columns: 300px 1fr; gap: 16px; height: 100%; min-height: 0; }
.cfg { display: grid; gap: 12px; align-content: start; }
.cfg .card { padding: 14px 16px; display: grid; gap: 10px; }
.cfg h5 { margin: 0; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.ref { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; }
.ref b { font-family: var(--mono); font-weight: 500; font-size: 11.5px; }
.applied { display: flex; flex-wrap: wrap; gap: 6px; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opt { padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); font-size: 12.5px; background: var(--surface); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.gen { display: grid; grid-template-rows: auto 1fr; gap: 12px; min-height: 0; }
.genh { display: flex; justify-content: space-between; align-items: center; }
.scripts { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; min-height: 0; }
.sc { display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
.sc .sh { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.beats { padding: 4px 16px; overflow: hidden; }
.beat { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.beat:last-child { border-bottom: 0; }
.beat .tm { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.beat .tm b { display: block; color: var(--accent); font-weight: 500; font-family: var(--f); font-size: 11.5px; margin-top: 2px; }
.vo { font-size: 13px; font-weight: 500; line-height: 1.45; }
.vis { font-size: 12px; color: var(--muted); margin-top: 3px; }
.jp .vo { font-family: "Noto Sans JP", var(--f); }

<script>

const I = {

const SCENES = [

  ['#b9c6ff','#dfe5ff','#f3f6ff','#7f8ee0','fx'],

const DUR = ['0:24','0:21','0:23','0:31','0:21','0:53','0:51','0:18','0:37','0:18','0:27','0:54'];

function comboChart(){
  const W=480,H=190,l=40,r=40,t=12,b=24, cw=(W-l-r)/UPD.length;
  const ys=v=>t+(1-v/1000)*(H-t-b), yi=v=>t+(1-v/100)*(H-t-b);
  let g='';
  [0,250,500,750,1000].forEach(v=>{g+=`<line x1="${l}" x2="${W-r}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line-soft)"/><text x="${l-6}" y="${ys(v)+3}" text-anchor="end">${v===1000?'$1M':'$'+v+'K'}</text>`;});
  [0,25,50,75,100].forEach(v=>{g+=`<text x="${W-r+6}" y="${yi(v)+3}">${v}K</text>`;});
  UPD.forEach((u,i)=>{const x=l+i*cw+cw*.22; g+=`<rect x="${x}" y="${ys(u.spend)}" width="${cw*.56}" height="${ys(0)-ys(u.spend)}" rx="3" fill="var(--accent)" fill-opacity=".85"/><text x="${l+i*cw+cw/2}" y="${H-8}" text-anchor="middle">v${u.v}</text>`;});
  const pts=UPD.map((u,i)=>`${l+i*cw+cw/2},${yi(u.inst)}`).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="var(--good)" stroke-width="2"/>`+UPD.map((u,i)=>`<circle cx="${l+i*cw+cw/2}" cy="${yi(u.inst)}" r="3" fill="var(--good)"/>`).join('');

}
function mixChart(){

  const y=v=>t+(1-v/100)*(H-t-b), yr=v=>t+(1-(v-100)/150)*(H-t-b);

  [100,175,250].forEach(v=>{g+=`<text x="${W-r+6}" y="${yr(v)+3}">${v}%</text>`;});

}

  ['Combat-highlight openings beat static character reveals','Ultimates and damage numbers up front convert better than splash art.',['Opening'],'t'],
  ['15–25 seconds is the conversion sweet spot','The completion advantage of short ads carries through to CTR.',['15–30s'],'t'],
  ['Japan responds to soothing music and character-driven stories','Clear regional preference in music and tone.',['JP','Tone'],'t'],
  ['Paid ads: no organic-style CTAs','Paid placements go straight to the app store, so skip "follow me" or "link in bio".',['CTA'],'t'],
  ['Brand-creator ads beat in-house edits on long-term ROAS','Licensed creator ads lead on D365 ROAS update after update.',['Producer'],'t'],
  ['In twist ads, the punchline lands within 8 seconds','Keep the setup under 8 seconds.',['Twist','Pacing'],'h'],
  ['Week 1 of an update pushes the new character; week 2 switches to gameplay','Content rotation within an update.',['Selling point'],'h'],
];
function knowledge(){
  const top = `<div class="crumbs"><b>Knowledge Base</b></div><div class="tabs"><span class="tab on">Knowledge</span><span class="tab">Feedback</span></div><div class="topr"><span class="btn ghost">Manage</span></div>`;
  const body = `<div class="kb">
    <div class="card kin"><div class="ch"><h3 class="sec">Add knowledge</h3><span class="muted" style="font-size:12px">AI summarises and sorts it</span></div>
      <div class="field"><label>Market</label><div class="inp"><span class="chip">JP</span></div></div>
      <div class="field"><label>Channel</label><div class="inp"><span class="muted">Any</span></div></div>
      <div class="seg" style="justify-self:start"><span class="on">Paste text</span><span>Upload doc</span><span>Upload video</span></div>
      <div class="inp ta">Japan v2.1 recap: talking-head ads with a calm tone kept CPI about 15% lower than fast-cut gameplay. Creators who explained the story beat creators who just reacted.</div>
      <div class="field"><label>Evidence</label><div class="seg"><span class="on">Tested in data</span><span>Hypothesis</span></div></div>
      <span class="btn" style="justify-content:center;padding:10px">${ic('spark')}Analyse and add</span>
    </div>
    <div class="card klist"><div class="kh"><div style="display:flex;gap:8px;align-items:center"><h3 class="sec">Knowledge</h3><span class="chip"><b>8</b> rules</span></div><span class="muted" style="font-size:12px">Used by AI in every report and script</span></div>
      <div class="kcats">${['All','Hooks','Openings','Video structure','Pacing','CTA','Audience insights','Market notes','Brand guidelines'].map((c,i)=>`<span class="opt${i===0?' on':''}">${c}</span>`).join('')}</div>
      <div class="krules">${RULES.map(([t,d,tags,e])=>`<div class="kr"><div><b>${t}</b><span class="sub">${d}</span></div><div class="tg2">${tags.map(x=>`<span class="tagc">${x}</span>`).join('')}<span class="ev ${e}">${e==='t'?'Tested':'Hypothesis'}</span></div></div>`).join('')}</div>
    </div>
  </div>`;
  return shell('knowledge', top, body);
}

const RENDER = {overview, tagging, library, insights, scripts, performance, planning, knowledge};

const stage = document.getElementById('stage');
let current = 'overview';
function fit(){ const app = stage.firstElementChild; if (!app) return; const k = stage.clientWidth/1240; app.style.transform = `scale(${k})`; stage.style.height = (870*k)+'px'; }
function render(){ stage.innerHTML = RENDER[current](); fit(); try { parent.postMessage({protoScreen: current}, '*'); } catch (e) {} }
document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if (t && RENDER[t.dataset.go]) { current = t.dataset.go; render(); } });
addEventListener('message', e => { const id = e.data && e.data.protoGo; if (id && RENDER[id]) { current = id; render(); } });
addEventListener('resize', fit);
addEventListener('keydown', e => { if (e.key === 'Escape') try { parent.postMessage({protoEsc: true}, '*'); } catch (err) {} });
render();
</script></body></html>
