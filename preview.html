    <script type="module">(function(){let e=document.createElement(`link`).relList;if(e&&e.supports&&e.supports(`modulepreload`))return;for(let e of document.querySelectorAll(`link[rel="modulepreload"]`))n(e);new MutationObserver(e=>{for(let t of e)if(t.type===`childList`)for(let e of t.addedNodes)e.tagName===`LINK`&&e.rel===`modulepreload`&&n(e)}).observe(document,{childList:!0,subtree:!0});function t(e){let t={};return e.integrity&&(t.integrity=e.integrity),e.referrerPolicy&&(t.referrerPolicy=e.referrerPolicy),t.credentials=e.crossOrigin===`use-credentials`?`include`:e.crossOrigin===`anonymous`?`omit`:`same-origin`,t}function n(e){if(e.ep)return;e.ep=!0;let n=t(e);fetch(e.href,n)}})();var e={edits:JSON.parse(`{"nodes.xbox-launch.summary.en":{"text":"Paid media for Genshin Impact’s Xbox launch had to drive console players to the landing page. I led the creative strategy across the US, France and Germany: four testable concepts, localised for each market, then reviewed with the media strategist to scale the winner in each.","ranges":[],"blueRanges":[]},"nodes.ua-creative-strategy.summary.en":{"text":"The Genshin Impact brand team had creators and production budget; the paid acquisition team needed more creator ads that converted. I built the pipeline between them from scratch: aligned both teams on the metrics that mattered, turned those into a creative testing framework, and scaled the formats that brought in higher-value users across Japan, North America and Europe.","ranges":[],"blueRanges":[]},"nodes.ua-creative-strategy.sections.0.items.0.en":{"text":"The acquisition team's tests showed creator ads scaled and converted well, but they couldn't produce enough of them. The brand team had creator resources but had never worked on user acquisition.","ranges":[],"blueRanges":[]},"nodes.zzz-jp-accounts.label.en":{"text":"Japan Social Channel Launch","ranges":[],"blueRanges":[]},"nodes.zzz-jp-accounts.summary.en":{"text":"Zenless Zone Zero was new in Japan and needed social channels that reached players beyond its official accounts. I took the first few channels from launch to a nine-channel network: worked out which positioning and formats Japanese players responded to, cut what didn’t work, and turned the rest into a system I handed over to the Zenless Zone Zero team.","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.team.en":{"text":"Me (creative strategy, brand team), 1 acquisition strategist, 1 acquisition specialist and 4 agency partners. The acquisition team owned media buying and budget; I owned creative strategy and production.","ranges":[],"blueRanges":[]},"nodes.zzz-jp-accounts.team.en":{"text":"Me (social strategy), 2 content reviewers and 3 agency partners","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.sections.0.items.added-7f687ed3-9abd-4a33-b2c1-3a343066832a.en":{"text":"I had to build the pipeline from scratch and prove, within a few game updates, that our creative could earn spend and bring in quality users, not just add volume. The budget only covered smaller creators, so the content itself had to do the work.","ranges":[],"blueRanges":[]},"nodes.ua-creative-strategy.label.en":{"text":"Creator Ad Pipeline","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.gip-testing.summary.en":{"text":"TikTok’s Gaming Incentive Programme pays creators to post about a game. Could it bring in users for Genshin Impact at acquisition-level efficiency, and could its videos work as ads? I designed a three-round test to answer both, each round measured against our acquisition benchmarks. The reach was efficient; the users and the content weren’t strong enough to scale, so I recommended stopping the programme and moving the budget to creator ads.","ranges":[],"blueRanges":[]},"nodes.xbox-launch.team.en":{"text":"Me (creative strategy), 1 media strategist, 2 creative producers and 1 agency partner","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.influencer-activation.summary.en":{"text":"For a flagship Genshin Impact character launch on X, I refreshed the creator strategy: a lineup built around the creators core players follow, pointed at the official event and its reward codes.","ranges":[],"blueRanges":[]},"nodes.genshin-en-accounts.summary.en":{"text":"Genshin Impact ran eight creator-style English channels on TikTok and YouTube, grown organically. I diagnosed why the established ones had stalled, refreshed their content mix and shaped the strategy for the new ones.","ranges":[],"blueRanges":[]},"nodes.giveaway-campaign.summary.en":{"text":"For a major Genshin Impact update, I led a giveaway hosted by a leading Genshin Impact fan account on X (1M+ followers) and seeded by 67 creators across X, TikTok and Instagram.","ranges":[],"blueRanges":[]},"nodes.interactive-filter.summary.en":{"text":"For Genshin Impact’s Lunar New Year event, I shaped two AR filters for TikTok and Snapchat that were fun and easy for anyone to join in, and briefed 70+ creators to seed the trend in launch week.","ranges":[],"blueRanges":[]},"nodes.landing-page.summary.en":{"text":"For a major Genshin Impact update, I designed the mechanic that turned the launch landing page into a game: a short personality quiz with a shareable result, and a reward draw that grew with every friend invited, so the page spread itself.","ranges":[],"blueRanges":[]},"nodes.ua-creative-strategy.headline.num":{"text":"~3.7×","ranges":[]},"nodes.ua-creative-strategy.headline.label.en":{"text":"projected LTV vs benchmark","ranges":[],"blueRanges":[]},"nodes.ua-creative-strategy.sections.1.items.added-9fef1963-fc4c-5a0f-9612-38b111483b57.en":{"text":"Owned the testing framework: Translated acquisition goals into market-specific creative hypotheses, using performance data to steer tests across hooks, creative angles, scripts and formats.","ranges":[],"blueRanges":[[0,27]]},"nodes.ua-creative-strategy.sections.1.items.added-baccf401-aeaa-5d5f-a7b5-e77e21f3780a.en":{"text":"Built the Creative Intelligence Dashboard: Used AI coding tools to automate creative tagging and performance analysis, surface winning patterns and turn them into reusable scripts and playbooks.","ranges":[],"blueRanges":[[0,41]]},"nodes.ua-creative-strategy.sections.1.items.added-c93b8178-fdcc-5e98-ba95-cb88d301db76.en":{"text":"Strengthened creator sourcing: Expanded regional talent pools through agency pitches and rotation, matching creators to the formats they perform best in.","ranges":[],"blueRanges":[[0,29]]},"nodes.ua-creative-strategy.sections.1.items.added-e732a9d1-1d2f-5f5c-b0a2-f3e8f64fd05a.en":{"text":"Directed creator production: Briefed creators, developed script templates and reviewed every video before launch.","ranges":[],"blueRanges":[[0,27]]},"nodes.ua-creative-strategy.results.added-94825da7-d573-5200-be3f-403cd06b1123.metric":{"text":"~3.7×","ranges":[]},"nodes.ua-creative-strategy.results.added-94825da7-d573-5200-be3f-403cd06b1123.en":{"text":"projected LTV vs benchmark","ranges":[],"blueRanges":[]},"nodes.ua-creative-strategy.results.added-ed8d16b2-fc46-56de-8d09-142c4d78b62a.metric":{"text":"+26%","ranges":[]},"nodes.ua-creative-strategy.results.added-ed8d16b2-fc46-56de-8d09-142c4d78b62a.en":{"text":"projected 365-day ROI vs benchmark","ranges":[],"blueRanges":[]},"nodes.ua-creative-strategy.results.added-6c0048bd-80b0-5c96-8257-50fedad6ed0b.metric":{"text":"0% → 15%","ranges":[]},"nodes.ua-creative-strategy.results.added-6c0048bd-80b0-5c96-8257-50fedad6ed0b.en":{"text":"brand-team share of paid spend","ranges":[],"blueRanges":[]},"nodes.ua-creative-strategy.results.added-fff12a30-e556-5598-b64a-c497c3bde34e.metric":{"text":"400+","ranges":[]},"nodes.ua-creative-strategy.results.added-fff12a30-e556-5598-b64a-c497c3bde34e.en":{"text":"creator videos delivered for testing","ranges":[]},"nodes.zzz-jp-accounts.sections.0.items.added-80678005-9bf0-55c2-9cb2-78f4c6d258b9.en":{"text":"The brief was to launch Zenless Zone Zero’s Japanese channels and hand them over once they could run on their own. With few creator-style game channels to learn from in Japan, I had to learn the market while testing what worked, then turn scattered experiments into a system another team could run, all on a fixed timeline.","ranges":[],"blueRanges":[]},"nodes.zzz-jp-accounts.sections.1.items.added-212a0d1d-8d8f-53e4-ace8-c3b04fd8d380.en":{"text":"Defined the channel strategy: Mapped Japanese player behaviour, competitor channels and content gaps to give each channel a niche with proven demand and clear content pillars across YouTube and X.","ranges":[],"blueRanges":[[0,28]]},"nodes.zzz-jp-accounts.sections.1.items.added-ccbf1c75-2442-54dc-a675-bd1ef41ad142.en":{"text":"Ran growth reviews: Tracked every channel against its KPIs, diagnosed the ones falling behind and brought winning formats from other niches to stalled channels to restart growth.","ranges":[],"blueRanges":[[0,18]]},"nodes.zzz-jp-accounts.sections.1.items.added-0c026763-5db2-5ef0-9d21-6fb5f333f0ad.en":{"text":"Managed agency partners: Coordinated three agencies, aligning briefs, reviews and performance targets to lift content quality and cost efficiency.","ranges":[],"blueRanges":[[0,23]]},"nodes.zzz-jp-accounts.sections.1.items.added-02c0f8fa-a124-511a-815a-6537f63cf891.en":{"text":"Handed over a repeatable system: Codified content learnings, KPIs and routines into playbooks, and transferred all nine channels to the Zenless Zone Zero team.","ranges":[],"blueRanges":[[0,31]]},"nodes.zzz-jp-accounts.results.added-7487e0e6-41d9-5240-ac20-6375c4494603.metric":{"text":"80M+","ranges":[]},"nodes.zzz-jp-accounts.results.added-7487e0e6-41d9-5240-ac20-6375c4494603.en":{"text":"organic views","ranges":[]},"nodes.zzz-jp-accounts.results.added-d7196f99-eb77-5506-99e9-9ccde22d89f4.metric":{"text":"50K+","ranges":[]},"nodes.zzz-jp-accounts.results.added-d7196f99-eb77-5506-99e9-9ccde22d89f4.en":{"text":"followers, +50% vs target","ranges":[],"blueRanges":[]},"nodes.zzz-jp-accounts.results.added-c477572c-2a9c-573b-bb21-e16be9aa0bec.metric":{"text":"50%+","ranges":[]},"nodes.zzz-jp-accounts.results.added-c477572c-2a9c-573b-bb21-e16be9aa0bec.en":{"text":"lower agency CPM","ranges":[],"blueRanges":[]},"nodes.zzz-jp-accounts.results.added-21cb79be-c714-5963-81f9-562823ea9f0d.metric":{"text":"9/9","ranges":[]},"nodes.zzz-jp-accounts.results.added-21cb79be-c714-5963-81f9-562823ea9f0d.en":{"text":"channels hitting view targets at handover","ranges":[]},"nodes.gip-testing.label.en":{"text":"TikTok UGC Channel Test","ranges":[]},"nodes.gip-testing.headline.num":{"text":"~60%","ranges":[]},"nodes.gip-testing.headline.label.en":{"text":"lower CPM, Round 1 to Round 3","ranges":[],"blueRanges":[]},"nodes.gip-testing.sections.0.items.added-926c202d-5065-558f-bebb-db6d2bdfcd9e.en":{"text":"Paid acquisition relied mainly on brand-style creative, and creator-led formats were untested at scale. The programme looked efficient, but nobody knew whether its users would stay or whether its videos would hold up as ads.","ranges":[],"blueRanges":[]},"nodes.gip-testing.sections.1.items.added-b7714687-09b3-5031-a3b1-2502bc85eb14.en":{"text":"Designed the test framework: Built a three-round roadmap, setting each round’s payout model (CPM or CPA), markets, themes, budgets and success metrics against our acquisition benchmarks.","ranges":[],"blueRanges":[[0,27]]},"nodes.gip-testing.sections.1.items.added-98d40a86-0813-54f2-a50e-4ead62e00747.en":{"text":"Led campaign execution: Owned all three rounds end to end, from task setup and creator briefs to progress tracking, submission reviews and recaps.","ranges":[],"blueRanges":[[0,22]]},"nodes.gip-testing.sections.1.items.added-0660d69b-43b2-5a25-b21f-e173c38fdec4.en":{"text":"Evaluated the channel and drove the decision: Measured reach, CPI, user quality and content relevance, then recommended stopping the programme and shifting budget to creator ads.","ranges":[],"blueRanges":[[0,44]]},"nodes.gip-testing.results.added-a6ea2b90-4a3a-5e36-9b4b-941c6d7685f8.metric":{"text":"80M+","ranges":[]},"nodes.gip-testing.results.added-a6ea2b90-4a3a-5e36-9b4b-941c6d7685f8.en":{"text":"views across three test rounds","ranges":[]},"nodes.gip-testing.results.added-dddfd4eb-1dbf-51c3-92d9-d603c8b9ac38.metric":{"text":"500K+","ranges":[]},"nodes.gip-testing.results.added-dddfd4eb-1dbf-51c3-92d9-d603c8b9ac38.en":{"text":"UGC submissions","ranges":[]},"nodes.gip-testing.results.added-c2840424-6eae-5b0d-9d4a-e0b7213f8abe.metric":{"text":"~60%","ranges":[]},"nodes.gip-testing.results.added-c2840424-6eae-5b0d-9d4a-e0b7213f8abe.en":{"text":"lower CPM, Round 1 to Round 3","ranges":[],"blueRanges":[]},"nodes.xbox-launch.headline.num":{"text":"+338%","ranges":[]},"nodes.xbox-launch.headline.label.en":{"text":"CTR vs benchmark","ranges":[]},"nodes.xbox-launch.sections.0.items.added-c21aaa2d-96b0-5371-bae0-e4dd8ab292e4.en":{"text":"The launch needed paid media to drive traffic to the Xbox landing page, not just awareness. That meant turning existing brand materials into 100+ localised assets, the brand team’s largest creative test for a paid brand campaign, with tight coordination across languages, platform specs and approvals.","ranges":[],"blueRanges":[]},"nodes.xbox-launch.sections.1.items.added-dbdecf4b-d4a8-549b-b43b-3119efeb349d.en":{"text":"Defined the creative strategy: Used past campaign learnings and regional player insights to build four testable creative concepts, then localised them into US, French and German versions to see which won in each market.","ranges":[],"blueRanges":[[0,29]]},"nodes.xbox-launch.sections.1.items.added-ebe84c61-3547-59c6-9dc8-5e38cce370ae.en":{"text":"Partnered on media optimisation: Shaped budget, regional priorities and targeting with the media strategist across YouTube, Meta, X and TikTok, then reviewed live results together to scale winners and pause underperformers.","ranges":[],"blueRanges":[[0,31]]},"nodes.xbox-launch.sections.1.items.added-c8ea2aa3-da69-5244-8d85-6fa5b4813c48.en":{"text":"Managed creative production: Wrote briefs covering copy, landing-page links and platform specs for all 100+ assets, and kept timelines, reviews and approvals on track.","ranges":[],"blueRanges":[[0,27]]},"nodes.xbox-launch.results.added-220010d2-fd13-50ed-8fa2-cbae4288bcb5.metric":{"text":"+338%","ranges":[]},"nodes.xbox-launch.results.added-220010d2-fd13-50ed-8fa2-cbae4288bcb5.en":{"text":"CTR vs benchmark","ranges":[]},"nodes.xbox-launch.results.added-65ac8ac2-7eb2-56c6-b825-be24dcc9aa5a.metric":{"text":"66%","ranges":[]},"nodes.xbox-launch.results.added-65ac8ac2-7eb2-56c6-b825-be24dcc9aa5a.en":{"text":"lower CPC vs benchmark","ranges":[]},"nodes.xbox-launch.results.added-04803685-f9f7-5b29-af9d-4c4c02ced43e.metric":{"text":"120M+","ranges":[]},"nodes.xbox-launch.results.added-04803685-f9f7-5b29-af9d-4c4c02ced43e.en":{"text":"impressions","ranges":[]},"nodes.xbox-launch.results.added-b44aab4d-c58f-55ce-bb4f-2ea08364aafd.metric":{"text":"~700K","ranges":[]},"nodes.xbox-launch.results.added-b44aab4d-c58f-55ce-bb4f-2ea08364aafd.en":{"text":"landing-page clicks","ranges":[]},"nodes.influencer-activation.headline.num":{"text":"~3×","ranges":[]},"nodes.influencer-activation.headline.label.en":{"text":"engagement vs benchmark","ranges":[]},"nodes.influencer-activation.sections.0.items.added-99467af1-8756-5653-a580-da2a2150a497.en":{"text":"Engagement on Genshin Impact’s recurring character campaigns on X was flattening, and it was weakest among English-speaking players. Our previous creator campaign aimed for broad appeal: many of its creators reached general gaming audiences rather than core Genshin players, so it brought reach but under 3% engagement.","ranges":[],"blueRanges":[]},"nodes.influencer-activation.sections.0.items.added-0481eb69-6336-5228-9fde-24c84a721f6c.en":{"text":"This time, I needed a creator lineup built around core players that would drive them to the official event on X and its in-game reward codes.","ranges":[],"blueRanges":[]},"nodes.influencer-activation.sections.1.items.added-1f1f1633-e4f7-5f33-9f1a-5634daff7f7e.en":{"text":"Set the creator strategy: Built the lineup around the artists, cosplayers, streamers and Genshin news creators that core players follow, so 80% of creators reached core players rather than general gaming audiences.","ranges":[],"blueRanges":[[0,24]]},"nodes.influencer-activation.sections.1.items.added-bc4911f9-e908-5898-addc-f64f8284d07b.en":{"text":"Localised for English-speaking players: Made English-language creators half the lineup and briefed a US agency on the art styles local players respond to.","ranges":[],"blueRanges":[[0,38]]},"nodes.influencer-activation.sections.1.items.added-df9e7dae-e6a6-5035-85e2-6706995b10b8.en":{"text":"Owned the full creator lifecycle: Ran budget, sourcing, briefing, timelines and approvals across two agencies, then benchmarked results to decide what to scale next.","ranges":[],"blueRanges":[[0,32]]},"nodes.influencer-activation.results.added-0d81c971-ef5e-516c-9372-88b7e007a664.metric":{"text":"13M+","ranges":[]},"nodes.influencer-activation.results.added-0d81c971-ef5e-516c-9372-88b7e007a664.en":{"text":"views across 56 creators and 78 posts","ranges":[]},"nodes.influencer-activation.results.added-b7b5e649-5c9c-5579-86c8-b7b38e48e8bf.metric":{"text":"~3×","ranges":[]},"nodes.influencer-activation.results.added-b7b5e649-5c9c-5579-86c8-b7b38e48e8bf.en":{"text":"engagement vs benchmark","ranges":[]},"nodes.influencer-activation.results.added-d4bed05e-0908-5f30-a108-a3e9a769d5cb.metric":{"text":"39%","ranges":[]},"nodes.influencer-activation.results.added-d4bed05e-0908-5f30-a108-a3e9a769d5cb.en":{"text":"lower CPM vs benchmark","ranges":[]},"nodes.influencer-activation.results.added-c11f65de-9f48-5a27-b9ae-8919593abb62.metric":{"text":"+88%","ranges":[]},"nodes.influencer-activation.results.added-c11f65de-9f48-5a27-b9ae-8919593abb62.en":{"text":"event exposure vs benchmark","ranges":[]},"nodes.giveaway-campaign.headline.num":{"text":"~900K","ranges":[]},"nodes.giveaway-campaign.headline.label.en":{"text":"code redemptions, ~4× target","ranges":[],"blueRanges":[]},"nodes.giveaway-campaign.sections.1.items.added-40d6b701-7c57-5ad2-8466-c4e23ffa7714.en":{"text":"Designed the campaign: Partnered with the fan account; to enter, players quote-posted the giveaway with their own creative take, and in-game reward codes turned views into a measurable action.","ranges":[],"blueRanges":[[0,21]]},"nodes.giveaway-campaign.sections.1.items.added-1b460a2f-2b29-5b53-a0ef-33de108e78cd.en":{"text":"Activated creators across platforms: Coordinated 67 creators across X, TikTok and Instagram, who posted their own entries first to show players how to join.","ranges":[],"blueRanges":[[0,35]]},"nodes.giveaway-campaign.sections.1.items.added-335e271f-4915-51cf-a087-edd3a1bc7416.en":{"text":"Led execution and the recap: Aligned four agencies on briefs, content review, timelines and tracking; codes beat the target, but fewer players entered because a creative quote-post took too much effort, so fan-account giveaways need one-tap actions, like a repost or a reply.","ranges":[],"blueRanges":[[0,27]]},"nodes.giveaway-campaign.results.added-36b376f7-559b-5059-bedf-829c5bb0f2b7.metric":{"text":"33M+","ranges":[]},"nodes.giveaway-campaign.results.added-36b376f7-559b-5059-bedf-829c5bb0f2b7.en":{"text":"impressions, +56% vs target","ranges":[],"blueRanges":[]},"nodes.giveaway-campaign.results.added-10a1ae0b-1890-525b-98f8-4207f784a485.metric":{"text":"~900K","ranges":[]},"nodes.giveaway-campaign.results.added-10a1ae0b-1890-525b-98f8-4207f784a485.en":{"text":"code redemptions, ~4× target","ranges":[],"blueRanges":[]},"nodes.giveaway-campaign.results.added-a3a5d2d8-aeff-56f3-ac24-5df6459739a3.metric":{"text":"~50%","ranges":[]},"nodes.giveaway-campaign.results.added-a3a5d2d8-aeff-56f3-ac24-5df6459739a3.en":{"text":"lower CPM vs target","ranges":[]},"nodes.genshin-en-accounts.label.en":{"text":"English Social Channel Growth","ranges":[]},"nodes.genshin-en-accounts.sections.0.items.added-970209e8-33a5-5841-99a8-261e1aff99c5.en":{"text":"Genshin Impact ran English-language social channels on TikTok and YouTube to keep players engaged between major updates. The established channels had stalled: formats were getting repetitive, fewer viewers were following and views dropped between updates. New channels needed a strategy built from scratch, all while keeping CPM under target.","ranges":[],"blueRanges":[]},"nodes.genshin-en-accounts.sections.1.items.added-25501a6e-6d56-58f2-af09-e5bce7d2e47b.en":{"text":"Diagnosed what stalled growth: Benchmarked each channel against TikTok trends and competitors, and pinpointed the gaps: too few evergreen topics, stale formats, weak follower conversion.","ranges":[],"blueRanges":[[0,29]]},"nodes.genshin-en-accounts.sections.1.items.added-6c2a86e1-2415-597c-9dfc-5cc3c6b7e2ff.en":{"text":"Refreshed the content mix: Moved guide channels from content that only worked on update days to evergreen gameplay tips, so views held up between updates.","ranges":[],"blueRanges":[[0,25]]},"nodes.genshin-en-accounts.sections.1.items.added-b4c09ad1-1cea-56ee-b7ad-aa48e911670e.en":{"text":"Shaped strategy for the new channels: Proposed audience, positioning, content pillars and cadence for each, then refined them on early data before scaling.","ranges":[],"blueRanges":[[0,36]]},"nodes.genshin-en-accounts.sections.1.items.added-0ba9f74f-9fef-5f04-95b6-f2001234c68e.en":{"text":"Ran growth reviews: Tracked KPIs and kept the agency’s output aligned with each channel’s goals.","ranges":[],"blueRanges":[[0,18]]},"nodes.genshin-en-accounts.results.added-d54343df-9217-5577-9d30-f757a6088f43.metric":{"text":"35M+","ranges":[]},"nodes.genshin-en-accounts.results.added-d54343df-9217-5577-9d30-f757a6088f43.en":{"text":"views across 8 channels","ranges":[]},"nodes.genshin-en-accounts.results.added-74a30dc1-cfe0-5846-88ee-94af3f70c055.metric":{"text":"64K+","ranges":[]},"nodes.genshin-en-accounts.results.added-74a30dc1-cfe0-5846-88ee-94af3f70c055.en":{"text":"new followers","ranges":[]},"nodes.genshin-en-accounts.results.added-8d52601a-0f85-5eb0-95f5-0ba9b9237076.metric":{"text":"~30%","ranges":[]},"nodes.genshin-en-accounts.results.added-8d52601a-0f85-5eb0-95f5-0ba9b9237076.en":{"text":"lower CPM vs target","ranges":[],"blueRanges":[]},"nodes.interactive-filter.sections.0.items.added-912d2bde-8136-580a-b8a9-9b7f496aa666.en":{"text":"Lantern Rite needed a social moment players could join, and this time the filter challenge was expanding beyond TikTok to Snapchat for the first time. The filters had to be fun to use, simple enough for anyone to recreate, and right for two different platforms. And the trend had to take off within a short window.","ranges":[],"blueRanges":[]},"nodes.interactive-filter.sections.1.items.added-2e5b74ba-b9e0-5ea0-bf03-af9cd673a498.en":{"text":"Shaped the filter concepts: Co-developed two gesture-based ideas from competitor research (a sky-lantern release for TikTok and Snapchat, and a lion-mask transformation for a new character on TikTok), then wrote the briefs and reviewed each iteration with TikTok’s effects team.","ranges":[],"blueRanges":[[0,26]]},"nodes.interactive-filter.sections.1.items.added-4718136c-4d14-58f9-b793-fb64223820b4.en":{"text":"Briefed creators: Turned each filter into simple video ideas for cosplay, beauty, pet, dance and transition creators, so their posts inspired players to make their own.","ranges":[],"blueRanges":[[0,16]]},"nodes.interactive-filter.sections.1.items.added-727f8834-d58a-5788-92a2-10aa0c103f52.en":{"text":"Vetted creators and content: Reviewed creator selection and videos for 70+ creators across TikTok and Snapchat.","ranges":[],"blueRanges":[[0,27]]},"nodes.landing-page.headline.num":{"text":"9.5M+","ranges":[]},"nodes.landing-page.headline.label.en":{"text":"visitors, ~7× benchmark","ranges":[]},"nodes.landing-page.sections.1.items.added-fe9fcb75-6305-5829-a747-163e19c8a5f3.en":{"text":"Benchmarked formats: Studied interactive web campaigns to find a mechanic with shareability built in.","ranges":[],"blueRanges":[[0,19]]},"nodes.landing-page.sections.1.items.added-f3f8d30a-34ea-57ba-9fc9-fe8111b884e0.en":{"text":"Designed the hook: Chose a personality quiz, a proven viral format, so every player got a personalised result worth sharing, and kept it to three questions to cut drop-off.","ranges":[],"blueRanges":[[0,17]]},"nodes.landing-page.sections.1.items.added-e5607aec-0041-546f-ad9a-1c845e2dd357.en":{"text":"Built the viral loop: Tied rewards to referrals. Finishing the quiz unlocked a reward draw and each friend invited earned another, so every share brought in about 4 new visitors.","ranges":[],"blueRanges":[[0,20]]},"nodes.landing-page.results.added-631e452c-655e-514d-bb55-b3fbe6744f36.metric":{"text":"9.5M+","ranges":[]},"nodes.landing-page.results.added-631e452c-655e-514d-bb55-b3fbe6744f36.en":{"text":"visitors, ~7× benchmark","ranges":[]},"nodes.landing-page.results.added-67b3312c-62a4-564c-8837-6a39122dad8b.metric":{"text":"1.8M+","ranges":[]},"nodes.landing-page.results.added-67b3312c-62a4-564c-8837-6a39122dad8b.en":{"text":"players in the draw, +60% vs benchmark","ranges":[]},"nodes.landing-page.results.added-6f94f8ce-8d56-506c-80a6-d81b9e6cefbb.metric":{"text":"3×","ranges":[]},"nodes.landing-page.results.added-6f94f8ce-8d56-506c-80a6-d81b9e6cefbb.en":{"text":"conversion rate vs benchmark","ranges":[]},"nodes.landing-page.results.added-9eee3862-17e7-560b-b79d-605da53d5e1d.metric":{"text":"~4","ranges":[]},"nodes.landing-page.results.added-9eee3862-17e7-560b-b79d-605da53d5e1d.en":{"text":"visitors per share, 2× target","ranges":[],"blueRanges":[]},"nodes.ai-workbench.label.en":{"text":"Creative Intelligence Dashboard","ranges":[]},"nodes.interactive-filter.label.en":{"text":"Branded Filter Campaign","ranges":[],"blueRanges":[]},"nodes.ai-workbench.sections.0.items.0.en":{"text":"AI tagging: Watches every video ad and tags its hook, format, pacing and more.","ranges":[],"blueRanges":[[0,10]]},"nodes.ai-workbench.sections.0.items.1.en":{"text":"Winning formula: Links tags to performance data to show what top ads have in common, across updates and markets.","ranges":[],"blueRanges":[[0,15]]},"nodes.ai-workbench.sections.0.items.2.en":{"text":"Script studio: Turns the winning formula into new scripts, written natively for each market.","ranges":[],"blueRanges":[[0,13]]},"nodes.ai-workbench.sections.0.items.3.en":{"text":"Campaign planning: Drafts the creative plan for the next campaign from past results.","ranges":[],"blueRanges":[[0,17]]},"nodes.ai-workbench.sections.0.items.4.en":{"text":"Knowledge base: Learns from every note, edit and piece of feedback, so results get sharper over time.","ranges":[],"blueRanges":[[0,14]]},"nodes.ai-workbench.headline.num":{"text":"40%","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ai-workbench.headline.label.en":{"text":"less time on analysis and production","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ai-workbench.headline.note.en":{"text":"I built it from scratch while running creative strategy for Genshin Impact’s creator ads.","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.xhs-ai-channel.sections.0.items.0.en":{"text":"Positioning: Studied the top AI creators and aimed the channel at AI beginners, with one promise: every video ends with something viewers can make themselves.","ranges":[],"blueRanges":[[0,11]]},"nodes.xhs-ai-channel.sections.0.items.1.en":{"text":"Content formula: Found what makes people save and follow, and built every video around it: result first, low barrier, clear steps.","ranges":[],"blueRanges":[[0,15]]},"nodes.xhs-ai-channel.sections.0.items.2.en":{"text":"Test and scale: Kept testing new formats and topics, cut what didn’t drive saves and follows, and scaled what did.","ranges":[],"blueRanges":[[0,14]]},"nodes.xhs-ai-channel.sections.0.items.3.en":{"text":"Brand partnerships: Won paid partnerships with China’s leading AI companies, including Alibaba’s Qwen, ByteDance’s Jimeng, MiniMax, Moonshot AI’s Kimi, LiblibAI and Lovart.","ranges":[],"blueRanges":[[0,18]]},"nodes.xhs-ai-channel.sections.0.items.4.en":{"text":"Content operations system: Built an AI system for research, scripts and performance reviews, so I can run the whole channel single-handed.","ranges":[],"blueRanges":[[0,25]]},"nodes.creator-workbench.sections.0.items.0.en":{"text":"Built on a working system: Every module is a workflow I already run for my own channel, from research and viral-post breakdowns to scripts and growth reviews.","ranges":[],"blueRanges":[[0,25]]},"nodes.creator-workbench.sections.0.items.1.en":{"text":"End to end: Takes content from research to idea, script, review and post-launch analysis in one place, instead of across chats, docs and spreadsheets.","ranges":[],"blueRanges":[[0,10]]},"nodes.creator-workbench.sections.0.items.2.en":{"text":"Human in the loop: Nothing gets made until the creator picks the idea, and every draft stops for review.","ranges":[],"blueRanges":[[0,17]]},"nodes.creator-workbench.sections.0.items.3.en":{"text":"Built for other creators: Helps new users set up their own content tags from a few sample posts, runs on the AI subscription they already pay for, and works in Chinese and English.","ranges":[],"blueRanges":[[0,24]]},"nodes.giveaway-campaign.label.en":{"ranges":[],"blueRanges":[],"text":"Community Giveaway"},"nodes.xhs-ai-channel.summary.en":{"ranges":[],"blueRanges":[],"text":"I built a channel from zero on Xiaohongshu (RedNote) and Douyin that shows beginners what they can make with AI tools, and run it like a growth project: find the audience, test what works, scale it, and turn the reach into paid brand partnerships."},"nodes.seminary-coop.sections.0.items.0.en":{"text":"Ran the social calendar: Planned and published posts, stories and carousels across Instagram, X and Facebook, and used performance data to refine what went out.","ranges":[],"blueRanges":[[0,23]]},"nodes.seminary-coop.sections.0.items.1.en":{"text":"Coordinated the Summer Gift Guide: Brought the campaign together across the website, social and newsletters.","ranges":[],"blueRanges":[[0,33]]},"nodes.nike.sections.0.items.0.en":{"text":"Supported launch campaigns: Helped run the Xiaohongshu (RedNote) campaigns that built awareness for Nike Women’s product launches.","ranges":[],"blueRanges":[[0,26]]},"nodes.nike.sections.0.items.1.en":{"text":"Hashtag and influencer strategy: Developed the #NikeOOTD hashtag and optimised the influencer and UGC programmes, growing hashtag views by 1.33M+ month on month.","ranges":[],"blueRanges":[[0,31]]},"nodes.nike.sections.0.items.2.en":{"text":"Competitor research: Turned competitor analysis into changes to Nike’s account strategy, SEO and paid search, contributing to 16K+ new followers (+45% year on year) and +173% engagement.","ranges":[],"blueRanges":[[0,19]]},"nodes.weber-shandwick.sections.0.items.0.en":{"text":"Research and social listening: Fed desk research, soundbite analysis and social listening into PR strategy and media sourcing for GUESS, Bosideng and Mido, and wrote the slogan for the GUESS × CLOTTEE campaign.","ranges":[],"blueRanges":[[0,29]]},"nodes.weber-shandwick.sections.0.items.1.en":{"text":"Launch support: Drafted press releases and supported media outreach for GUESS’s Disney collection launch, contributing to a 33% rise in GUESS’s Q3 PR value.","ranges":[],"blueRanges":[[0,14]]},"nodes.nowness.sections.0.items.0.en":{"text":"Ran the accounts: Managed publishing on WeChat and Weibo, optimising content and timing for impressions and engagement.","ranges":[],"blueRanges":[[0,16]]},"nodes.nowness.sections.0.items.1.en":{"text":"Ideas and layout: Pitched story ideas and artists to feature, and helped lay out art and culture pieces, contributing to 10K+ new followers and a 15% rise in read-through.","ranges":[],"blueRanges":[[0,16]]},"nodes.xjtlu.sections.0.items.0.en":{"text":"Top of the cohort: Ranked 1st of 70 with a 3.9/4.0 GPA, and awarded the National Scholarship and the University Academic Excellence Award.","ranges":[],"blueRanges":[[0,17]]},"nodes.xjtlu.sections.0.items.1.en":{"text":"Final-year research: How a Chinese rap show defined “authentic” hip-hop for its audience, using discourse and content analysis of lyrics and viewer reviews.","ranges":[],"blueRanges":[[0,19]]},"nodes.uchicago.sections.0.items.0.en":{"text":"Coursework: Interpretive theory, film history, video game history, and gender and sexuality studies.","ranges":[],"blueRanges":[[0,10]]},"nodes.uchicago.sections.0.items.1.en":{"text":"Audience research: A virtual ethnography of online player communities and how they negotiate with game publishers.","ranges":[],"blueRanges":[[0,17]]},"nodes.uchicago.sections.0.items.2.en":{"text":"Data: Python and data publishing alongside the humanities core.","ranges":[],"blueRanges":[[0,4]]}}`),lists:{"nodes.ua-creative-strategy.sections.0.items":[`0`,`added-7f687ed3-9abd-4a33-b2c1-3a343066832a`],"nodes.ua-creative-strategy.sections.1.items":[`added-9fef1963-fc4c-5a0f-9612-38b111483b57`,`added-baccf401-aeaa-5d5f-a7b5-e77e21f3780a`,`added-c93b8178-fdcc-5e98-ba95-cb88d301db76`,`added-e732a9d1-1d2f-5f5c-b0a2-f3e8f64fd05a`],"nodes.ua-creative-strategy.results":[`added-94825da7-d573-5200-be3f-403cd06b1123`,`added-ed8d16b2-fc46-56de-8d09-142c4d78b62a`,`added-6c0048bd-80b0-5c96-8257-50fedad6ed0b`,`added-fff12a30-e556-5598-b64a-c497c3bde34e`],"nodes.xbox-launch.sections.0.items":[`added-c21aaa2d-96b0-5371-bae0-e4dd8ab292e4`],"nodes.xbox-launch.sections.1.items":[`added-dbdecf4b-d4a8-549b-b43b-3119efeb349d`,`added-ebe84c61-3547-59c6-9dc8-5e38cce370ae`,`added-c8ea2aa3-da69-5244-8d85-6fa5b4813c48`],"nodes.zzz-jp-accounts.sections.0.items":[`added-80678005-9bf0-55c2-9cb2-78f4c6d258b9`],"nodes.zzz-jp-accounts.sections.1.items":[`added-212a0d1d-8d8f-53e4-ace8-c3b04fd8d380`,`added-ccbf1c75-2442-54dc-a675-bd1ef41ad142`,`added-0c026763-5db2-5ef0-9d21-6fb5f333f0ad`,`added-02c0f8fa-a1 新渠道测试框架`},team:{en:`Me (testing strategy and project lead) and 1 data operations specialist, working with 2 platform liaisons from TikTok`},type:`case`,period:`Dec 2024 – Nov 2025`,parent:`growth-paid`,featured:!0,headline:{num:`80M+`,label:{en:`views across three test rounds`}},label:{en:`TikTok UGC Incentive Program`},kicker:{en:`Genshin Impact · TikTok`},context:{en:`Genshin Impact`},tags:[{en:`TikTok`},{en:`UGC`}],platforms:[`tiktok`],markets:[`US`,`JP`],summary:{en:`I designed and ran a three-round testing framework to see whether TikTok’s UGC incentive program could boost installs efficiently and supply videos that meet our standard for UA creative.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`Genshin Impact’s UA relied mainly on brand creatives. TikTok’s UGC incentive program opened up a new possibility: could it boost installs efficiently as a UA channel, and could its videos work as UA creatives? I needed to design a testing framework to find out.`}]},{title:{en:`What I did`,zh:`我做了什么`},items:[{en:`Designed the test framework: Built a three-round roadmap, setting each round’s payout model (CPM or CPA), markets, themes, budgets and success metrics against our acquisition benchmarks.`},{en:`Led campaign execution: Owned all three rounds end to end, from task setup and creator briefs to progress tracking, submission reviews and recaps.`},{en:`Raised content quality: Rewrote task pages with clearer requirements and official reference videos, and flagged off-brief videos to free up the prize pool for better ones.`},{en:`Evaluated performance and drove the decision: Measured reach, CPI, user quality and content relevance against our UA benchmarks, then recommended stopping the program and shifting budget to creator ads for UA.`}]}],results:[{metric:`80M+`,en:`views across three test rounds`},{metric:`500K+`,en:`UGC submissions`},{metric:`~60%`,en:`lower CPM, Round 1 to Round 3`},{metric:``,en:`Program stopped; budget shifted to creator ads for UA`}],diagram:{src:`media/gip-testing/gip-rounds-diagram.png`,alt:{en:`How I ran the tests: set goals, design the round, run it, evaluate the full funnel; findings shape the next round`}}},{id:`xbox-launch`,mapLabel:{en:`Xbox Launch`},team:{en:`Me (creative strategy), 1 media strategist, 2 creative producers and 1 agency partner`},type:`case`,period:`Nov 2024`,parent:`growth-paid`,headline:{num:`+338%`,label:{en:`CTR vs the earlier benchmark`}},label:{en:`Xbox Launch Paid Campaign`},kicker:{en:`Genshin Impact · Meta, YouTube, TikTok, X`},context:{en:`Genshin Impact`},tags:[{en:`Meta`},{en:`YouTube`},{en:`TikTok`},{en:`X`}],platforms:[`meta`,`youtube`,`tiktok`,`x`],markets:[`US`,`DE`,`FR`],summary:{en:`Structured a localized creative test around four value propositions to move console players from interest to landing-page action.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`For the Xbox launch, paid media needed to drive landing-page traffic, not just awareness. The goal was to improve CTR and identify which creative messages could move console players from interest to action across YouTube, X, Meta, and TikTok.`},{en:`The challenge was execution-heavy: our team had to turn existing brand materials into a large localized creative test while keeping platform specs, language needs, and approval requirements aligned.`}]},{title:{en:`What I did`,zh:`我做了什么`},items:[{en:`Built the test around four messages: open world, global community, cloud gaming across devices, free content.`},{en:`Adapted brand materials into 16 cuts, localized into 144 EN / FR / DE assets.`},{en:`Reviewed results by channel, region and message with Media Strategy.`}]}],results:[{metric:`+338%`,en:`CTR versus the earlier benchmark.`},{metric:`66%`,en:`lower CPC versus the earlier benchmark.`},{metric:`120M+`,en:`impressions`},{metric:`~700K`,en:`landing-page clicks across the campaign.`}],media:[{src:`media/xbox-launch/genshin-xbox-banner-en-qr-blurred.jpg`,thumbnail:`media/xbox-launch/ 自然播放`},team:{en:`Me (social strategy), 2 Japanese-language content reviewers and 3 agency partners`},type:`case`,parent:`growth-social`,featured:!0,headline:{num:`80M+`,label:{en:`organic views across 9 channels`}},label:{en:`Zenless Zone Zero: JP Account Growth`},kicker:{en:`Zenless Zone Zero · YouTube, X`},context:{en:`Zenless Zone Zero`},tags:[{en:`YouTube`},{en:`X`}],platforms:[`youtube`,`x`],period:`Jul 2024 – Jun 2025`,markets:[`JP`],summary:{en:`Took over an early-stage Japanese creator-account matrix and scaled it into a repeatable growth system before handover.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`Zenless Zone Zero was still in an early JP growth stage, and official brand channels alone were not enough to drive always-on discovery. The goal of the creator-account matrix was to build non-official discovery channels that felt native to YouTube and X, helped players understand the game, and kept player discussion active beyond campaign moments.`},{en:`The team had limited precedent for operating brand-managed, third-party-style creator accounts as growth channels in JP. When I took over the early-stage matrix, the challenge was to identify which account positions and content formats could grow, then turn scattered experiments into a repeatable growth system before handover.`}]},{title:{en:`What I did`,zh:`我做了什么`},items:[{en:`Set account positioning across guide, entertainment and lore lanes; closed weak directions.`},{en:`Ran performance reviews on hooks, topics, packaging and platform fit; redirected stalled accounts.`},{en:`Documented SOPs, KPI logic and routines for handover.`}]}],results:[{metric:`80M+`,en:`organic views`},{metric:`50K+`,en:`followers`},{metric:`50%`,en:`lower CPM`}],media:[{src:`media/zzz-jp-accounts/gentle-house.jpg`,thumbnail:`media/zzz-jp-accounts/gentle-house-thumb.jpg`,floating:!0,alt:{en:`Zenless Zone Zero — Gentle House character artwork`}}],diagram:{src:`media/zzz-jp-accounts/zzz-system-diagram.png`,alt:{en:`How the channels launched and grew: map the market, position channels, brief and produce, review, adapt winners, hand over`}}},{id:`interactive-filter`,mapLabel:{en:`Filter Campaign`},mapTag:{en:`600M+ views`},note:{en:`600M+ views`,zh:`6 亿+ 播放`},team:{en:`Me (filter concepts and creator activation support), 1 campaign lead, 2 platform liaisons from TikTok and Snapchat, and 3 agency partners`},type:`case`,period:`Jan – Feb 2024`,parent:`growth-social`,featured:!0,headline:{num:`600M+`,label:{en:`views across TikTok and Snapchat`}},label:{en:`TikTok & Snapchat Branded Filter Campaign`},kicker:{en:`Genshin Impact · TikTok, Snapchat`},context:{en:`Genshin Impact`},tags:[{en:`TikTok`},{en:`Snapchat`},{en:`AR filters`},{en:`Creator marketing`}],platforms:[`tiktok`,`snapchat`],markets:[`US`,`EU`,`JP`],summary:{en:`I helped create two AR filters for Lantern Rite, Genshin Impact’s annual Lunar New Year event, and activated 70+ creators to show players how to use them, as the campaign expanded from TikTok to Snapchat for the first time. It drew 600M+ views and 600K+ player videos, and the Snapchat Lens ranked #1 among sponsored Lenses.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`Lantern Rite needed a social moment players could join, and this year the filter challenge was moving beyond TikTok to Snapchat for the first time. The filters had to be fun to use, simple enough for anyone to recreate, and right for two platforms whose users behave differently. We also had only a short window to build momentum and get the trend to take off.`}]},{title:{en:`What I did`,zh:`我做了什么`},items:[{en:`Shaped the filter concepts: Researched competitor filters and helped develop two gesture-based ideas: releasing a sky lantern for TikTok and Snapchat, and a lion-mask transformation for a new character on TikTok. I wrote the creative briefs and reviewed each iteration with TikTok’s effects team.`},{en:`Briefed creators: Turned each filter into simple video ideas for cosplay, beauty, pet, dance and transition creators, so their posts inspired players to make their own.`},{en:`Supported creator activation: Reviewed creator selection and content for 70+ creators across TikTok and Snapchat, whose videos went live in the first week to kick off the trend.`}]}],results:[{metric:`600M+`,en:`views across TikTok and Snapchat`},{metric:`600K+`,en:`player videos made with the filters`},{metric:`#1`,en:`in Snapchat’s sponsored Lens ranking`},{metric:`180M+`,en:`views from 57 TikTok creators`}],media:[{src:`media/interactive-filter/lantern-rite-event-banner.jpg`,thumbnail:`media/interactive-filter/lantern-rite-event-thumb.jpg`,floating:!0,alt:{en:`Genshin Impact Lantern Rite submission event banner, the TikTok event players joined with the filters`}}],links:[{label:{en:`TikTok event page`,zh:`TikTok 活动页`},href:`https://activity.us.tiktok.com/magic/eco/runtime/release/65ae743a08a22502879a1571?appType=muse&magic_page_no=1&use_spark=1&magic_source=usExternal`},{label:{en:`Creator video example`,zh:`达人视频示例`},href:`https://www.tiktok.com/@claudiaalende/video/7330704427923377450`}]},{id:`influencer-activation`,team:{en:`Me (creator strategy and execution), 2 execution support specialists and 2 agency partners`},type:`case`,period:`Jan 2026`,parent:`growth-social`,headline:{num:`~3x`,label:{en:`engagement vs the last creator campaign`}},label:{en:`X Creator Campaign`},kicker:{en:`Genshin Impact · X`},context:{en:`Genshin Impact`},tags:[{en:`X`},{en:`Creator marketing`}],platforms:[`x`],markets:[`NA`,`JP`],summary:{en:`I rebuilt the creator strategy for a flagship Genshin Impact character launch on X, focusing on the creators core players actually follow. The campaign delivered 13M+ views at 8%+ engagement, about 3x the previous creator campaign at 39% lower CPM.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`Engagement on Genshin Impact’s recurring character campaigns on X was flattening, and it was weakest among English-speaking players. Our previous creator campaign aimed for broad appeal: many of its creators reached general gaming audiences rather than core Genshin players, so it brought reach but under 3% engagement. For a major character launch, I needed to refocus creators on core players and drive them to the official X event and its in-game reward codes.`}]},{title:{en:`What I did`,zh:`我做了什么`},items:[{en:`Rebuilt the creator strategy: Shifted spend from broad-appeal creators to the artists, cosplayers, streamers and Genshin news creators that core players follow, so 80% of the lineup reached core players. I also grew English-language creators to half the lineup and briefed a US agency on art styles North American players respond to.`},{en:`Led execution and benchmarking: Managed budget, creator sourcing, timelines and approvals with two agencies, then benchmarked results against the previous creator campaign to decide what to scale next.`}]}],results:[{metric:`13M+`,en:`views across 56 creators and 78 posts`},{metric:`~3x`,en:`engagement vs the last creator campaign`},{metric:`39%`,en:`lower CPM than the last creator campaign`},{metric:`+88%`,en:`EN impressions vs a comparable launch`}],media:[{src:`media/influencer-activation/moonlit-support-banner.jpg`,thumbnail:`media/influencer-activation/moonlit-support-thumb.jpg`,floating:!0,alt:{en:`Genshin Impact "Moon Maiden" Moonlit Support event banner, the official X event the creator campaign drove players to`}}]},{id:`giveaway-campaign`,mapLabel:{en:`Community Giveaway`},team:{en:`Me (campaign lead and strategy), 2 execution support specialists and 4 agency partners`},type:`case`,period:`Aug 2024`,parent:`growth-social`,headline:{num:`~900K`,label:{en:`code redemptions, about 4x the goal`}},label:{en:`Cross-Platform Community Giveaway`},kicker:{en:`Genshin Impact · X, TikTok, Instagram`},context:{en:`Genshin Impact`},tags:[{en:`X`},{en:`TikTok`},{en:`Instagram`},{en:`Creator marketing`}],platforms:[`x`,`tiktok`,`instagram`],markets:[`NA`,`JP`],summary:{en:`For a major Genshin Impact update, I led a giveaway with the biggest Genshin fan account on X, backed by 67 creators across X, TikTok and Instagram, to reach players beyond official channels. It drew 33M+ impressions and about 900K in-game code redemptions, roughly 4x the goal.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`Genshin Impact’s community events on official channels kept reaching the same core players. For a major update, I wanted to test whether a giveaway hosted by a big fan account could reach casual and lapsed players and get them to act.`}]},{title:{en:`What I did`,zh:`我做了什么`},items:[{en:`Designed the campaign: Partnered with the biggest Genshin fan account on X (1M+ followers). To enter, players quote-posted the giveaway with their own creative take, and in-game reward codes turned views into a measurable action.`},{en:`Activated creators across platforms: Coordinated 67 creators across X, TikTok and Instagram, who posted their own entries first to show players how to join.`},{en:`Led execution and the recap: Aligned four agencies on briefs, content review, timelines and tracking. Code redemptions beat the goal, but fewer players entered the giveaway itself because quote-posting a creative entry took too much effort on X. The lesson: giveaways run with fan accounts need one-tap actions, like a repost or a reply.`}]}],results:[{metric:`33M+`,en:`impressions, +56% vs target`},{metric:`~900K`,en:`code redemptions, about 4x the goal`},{metric:`~50%`,en:`lower CPM than target`},{metric:`99%`,en:`positive sentiment`}],links:[{label:{en:`Creator video example`,zh:`达人视频示例`},href:`https://www.instagram.com/p/C_Myepry5Co/`}]},{id:`genshin-en-accounts`,mapLabel:{en:`English Social Growth`},team:{en:`Me (growth strategy support and content review), 1 growth strategy lead and 1 agency partner`},type:`case`,parent:`growth-social`,headline:{num:`35M+`,label:{en:`views across 8 channels`}},label:{en:`EN Social Channel Growth`},kicker:{en:`Genshin Impact · TikTok, YouTube`},context:{en:`Genshin Impact`},tags:[{en:`TikTok`},{en:`YouTube`}],platforms:[`tiktok`,`youtube`],period:`Oct – Dec 2023`,markets:[`NA`],summary:{en:`I helped grow a network of 8 English-language Genshin Impact channels on TikTok and YouTube, refreshing the strategy for channels that had plateaued and building it from scratch for new ones. Together they drew 35M+ views and 64K+ new followers at about 30% below target CPM.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`Genshin Impact ran a network of English-language social channels on TikTok and YouTube to keep players engaged between major updates. The established channels had stalled: formats were getting repetitive, fewer viewers were following, and views dropped between updates. At the same time, new channels needed a social strategy built from scratch, all while keeping CPM under target.`}]},{title:{en:`What I did`,zh:`我做了什么`},items:[{en:`Diagnosed what stalled growth: Used Tubular and monthly reports to compare TikTok trends, competitor channels and each channel’s performance, and pinpointed the gaps: too few evergreen topics, stale formats and weak follower conversion.`},{en:`Refreshed the content mix: Turned the findings into changes for each channel. Guide channels that leaned on time-sensitive patch tutorials added short, entertaining gameplay tips and varied their covers, so views no longer depended on update days.`},{en:`Built strategy for the new channels: Defined each channel’s audience, positioning, content pillars, formats and posting cadence from platform research and competitor benchmarks, then refined them on early performance data before scaling production.`},{en:`Ran growth reviews: Tracked KPIs and kept the agency’s output aligned with each channel’s goals.`}]}],results:[{metric:`35M+`,en:`views across 8 channels`},{metric:`+64K`,en:`new followers`},{metric:`~30%`,en:`lower CPM vs target`}],media:[{src:`media/genshin-en-accounts/genshin-social-growth.jpg`,thumbnail:`media/genshin-en-accounts/genshin-social-growth-thumb.jpg`,floating:!0,alt:{en:`Genshin Impact artwork featuring Aether and Lumine`}}]},{id:`xhs-ai-channel`,mapLabel:{en:`Xiaohongshu Channel`},type:`case`,parent:`growth-social`,org:``,note:{en:`my own channel`,zh:`我自己的账号`},headline:{num:`2M+`,label:{en:`views across Xiaohongshu and Douyin`}},label:{en:`Xiaohongshu AI Tutorial Channel`},kicker:{en:`Xiaohongshu · Douyin`},tags:[{en:`Xiaohongshu`},{en:`Douyin`}],platforms:[`xhs`],period:`2025 – present`,markets:[`CN`],summary:{en:`An AI channel I built from zero on Xiaohongshu (RedNote) and Douyin, two of China’s biggest social platforms. I run it like a growth project: find the audience, test what works, scale it, and turn the reach into brand partnerships with China’s leading AI companies.`},sections:[{title:{en:`What I did`,zh:`我做了什么`},items:[{en:`Positioning: Studied the top AI creators and aimed the channel at AI beginners, with one promise: every video ends with something viewers can make themselves.`},{en:`Content formula: Found what makes people save and follow, and built every video around it: result first, low barrier, clear steps.`},{en:`Test and scale: Kept testing new formats and topics, cut what didn’t drive saves and follows, and scaled what did.`},{en:`Brand partnerships: Won paid partnerships with China’s leading AI companies, including Alibaba’s Qwen, ByteDance’s Jimeng, MiniMax, Moonshot AI’s Kimi, LiblibAI and Lovart.`},{en:`Content operations system: Built an AI system for research, scripts and performance reviews, so I can run the whole channel single-handed.`}]}],results:[{metric:`2M+`,en:`views across Xiaohongshu and Douyin`},{metric:`16K+`,en:`followers`},{metric:`170K+`,en:`likes`},{metric:`6`,en:`paid partners among China’s top AI brands`}],related:[`creator-workbench`],links:[{label:{en:`Xiaohongshu profile`},href:`https://www.xiaohongshu.com/user/profile/62a6b493000000001b02aa8d`},{label:{en:`Breakout video`},href:`htt `},mapLabel:{en:`Creator OS`},context:{en:`Personal project`},tags:[{en:`Vibe Coding`},{en:`Obsidian`},{en:`Claude Code`},{en:`Codex`}],summary:{en:`An Obsidian plugin built from the AI system that runs my Xiaohongshu channel, so any creator can use it. Agents do the research, analysis and drafting; the creator makes every call, without having to learn how agents work.`},sections:[{title:{en:`What it does`,zh:`功能`},open:!0,items:[{en:`Built on a working system: Every module is a workflow I already run for my own channel, from research and viral-post breakdowns to scripts and growth reviews.`},{en:`End to end: Takes content from research to idea, script, review and post-launch analysis in one place, instead of across chats, docs and spreadsheets.`},{en:`Human in the loop: Nothing gets made until the creator picks the idea, and every draft stops for review.`},{en:`Built for other creators: Helps new users set up their own content tags from a few sample posts, runs on the AI subscription they already pay for, and works in Chinese and English.`}]}],prototype:{icon:`workbench`,src:`demo/workbench.html`,poster:`media/creator-workbench/poster.jpg`,video:[`media/creator-workbench/promo.webm`,`media/creator-workbench/promo.mp4`]},gallery:[n(`workbench`,`creator-workbench`,`screens`,{en:`Prototype screens`},{en:`Sample data`})],related:[`xhs-ai-channel`],alwaysLinked:[`xhs-ai-channel`]},{id:`creative`,type:`branch`,parent:`root`,label:{en:`Creative Work`,zh:`创意作品`},kicker:{en:`Area of work`,zh:`工作领域`},summary:{en:`Away from work, I take photos and design things.`,zh:`工作之余，我喜欢拍照和做设计。`}},{id:`photography`,type:`creative`,parent:`creative`,label:{en:`Photography`,zh:`摄影`},period:`2021 – 2024`,summary:{en:`Photos from my travels, grouped by place.`,zh:`旅行中拍的照片，按地点分组。`},gallery:[n(`japan`,`photography/japan`,`photos`,{en:`Japan`,zh:`日本`},{en:`2024`}),n(`europe`,`photography/europe`,`photos`,{en:`Europe`,zh:`欧洲`},{en:`Italy · France · Barcelona · 2024`,zh:`意大利 · 法国 · 巴塞罗那 · 2024`})
