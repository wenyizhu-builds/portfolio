onal player insights to build four testable creative concepts, adapted for US, French and German audiences.","ranges":[],"blueRanges":[[0,29]],"boldRanges":[]},"nodes.xbox-launch.sections.1.items.1.en":{"text":"Managed creative production: Wrote briefs covering copy, landing-page links and platform specs for all 144 assets, and kept timelines, reviews and approvals on track.","ranges":[],"blueRanges":[[0,27]],"boldRanges":[]},"nodes.xbox-launch.sections.1.items.2.en":{"text":"Supported media optimization: Helped shape budget, regional priorities and targeting across YouTube, Meta, X and TikTok, then reviewed live results with the media team to scale winners and pause underperformers.","ranges":[],"blueRanges":[[0,28]],"boldRanges":[]},"nodes.xbox-launch.results.3.en":{"text":"landing-page clicks","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.xbox-launch.results.0.en":{"text":"CTR versus the earlier benchmark","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.xbox-launch.results.1.en":{"text":"lower CPC versus the earlier benchmark","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.xbox-launch.results.2.en":{"text":"impressions across the campaign","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.summary.en":{"text":"I led the brand team's creative strategy for Genshin Impact's user acquisition, building a creator-led ad pipeline across Japan, North America and Europe. Our creatives delivered ~3.7× projected LTV and 26% higher projected 365-day ROI than the UA benchmark.","ranges":[],"blueRanges":[[179,184],[203,206]],"boldRanges":[]},"nodes.ua-creative-strategy.results.0.metric":{"text":"400+","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.results.2.metric":{"text":"+26%","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.results.0.en":{"text":"Creator videos delivered for testing","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.results.2.en":{"text":"Projected 365-day ROI vs UA-team","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.results.3.metric":{"text":"~3.7×","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.results.3.en":{"text":"Projected LTV vs UA-team creatives","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.results.1.en":{"text":"Brand-team share of UA spend","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.results.1.metric":{"text":"0% → 15%","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.sections.0.items.0.en":{"text":"The UA team's tests showed creator ads scaled and converted well, but they couldn't produce enough of them. The brand team had creator resources but had never worked on user acquisition. ","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.sections.1.items.0.en":{"text":"Built and evolved the testing framework: Translated acquisition goals into market-specific creative hypotheses, using performance data to steer tests across hooks, creative angles, scripts and formats.","ranges":[],"blueRanges":[[0,39]],"boldRanges":[]},"nodes.ua-creative-strategy.sections.1.items.2.en":{"text":"Directed creator production: Briefed creators, developed script templates and reviewed every video before launch.","ranges":[],"blueRanges":[[0,27]],"boldRanges":[]},"nodes.ua-creative-strategy.sections.1.items.1.en":{"text":"Built the AI Creative Intelligence Dashboard: Vibe-coded a tool that automates creative tagging and performance analysis, surfaces winning patterns, and turns them into reusable scripts and playbooks.","ranges":[],"blueRanges":[[0,44]],"boldRanges":[]},"nodes.zzz-jp-accounts.label.en":{"text":"Zenless Zone Zero: Social Launch in Japan","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.zzz-jp-accounts.summary.en":{"text":"I scaled an early network of social channels for Zenless Zone Zero in Japan to 9 channels and 80M+ organic views, while cutting cost per view by more than 50%.","ranges":[],"blueRanges":[[94,98],[145,158]],"boldRanges":[]},"nodes.zzz-jp-accounts.sections.0.items.0.en":{"text":"I was on the Genshin Impact brand team, which had experience growing social channels, so the Zenless Zone Zero team asked us to launch its Japanese channels and hand them over once they could run on their own. There was little precedent for growing channels like these in Japan, so I had to learn the market while testing what worked, then turn scattered experiments into a system the Zenless Zone Zero team could take over, all within a limited timeframe.","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.team.en":{"text":"Me (creative strategy, brand team), 1 UA strategist, 1 UA specialist and 4 agency partners. The UA team owned media buying and budget; I owned creative strategy and production.","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.zzz-jp-accounts.team.en":{"text":"Me (social strategy), 2 content reviewers and 3 agency partners","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.zzz-jp-accounts.sections.1.items.0.en":{"text":"Defined the channel strategy: Researched Japanese player behavior, competitor channels and content gaps to match each channel to a niche with proven demand and room to grow, with clear content pillars across YouTube and X.","ranges":[],"blueRanges":[[0,28]],"boldRanges":[]},"nodes.zzz-jp-accounts.sections.1.items.1.en":{"text":"Ran biweekly growth reviews: Tracked every channel against its KPIs, diagnosed the ones falling behind and stepped in to redirect them.","ranges":[],"blueRanges":[[0,27]],"boldRanges":[]},"nodes.zzz-jp-accounts.sections.1.items.2.en":{"text":"Managed agency partners: Coordinated three agencies, aligning briefs, reviews and performance targets to lift content quality and cost efficiency.","ranges":[],"blueRanges":[[0,23]],"boldRanges":[]},"nodes.zzz-jp-accounts.sections.1.items.added-c77fcd17-843b-4baa-bba3-276856c83535.en":{"text":"Handed over a self-running system: Codified content learnings, KPIs and routines into playbooks, and transferred all nine channels to the Zenless Zone Zero team.","ranges":[],"blueRanges":[[0,33]],"boldRanges":[]},"nodes.ua-creative-strategy.sections.1.items.added-5b0f3c2e-8a1d-4f6b-9c7e-2d4a6f8b1e30.en":{"text":"Strengthened creator sourcing: Expanded regional talent pools through agency pitches and rotation, matching creators to the formats they perform best.","ranges":[],"blueRanges":[[0,29]],"boldRanges":[]},"nodes.ua-creative-strategy.sections.0.items.added-7f687ed3-9abd-4a33-b2c1-3a343066832a.en":{"text":"I had to build the Brand-to-UA pipeline from scratch and prove, within a few game updates, that our creatives could earn spend and bring in quality players, not just add volume. The budget only covered smaller creators, so the content itself had to do the work.","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.ua-creative-strategy.label.en":{"text":"Creator Ad Pipeline","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.zzz-jp-accounts.sections.1.items.added-8e2d4b61-3c7a-4f19-a5b0-6d9e1c2f7a84.en":{"text":"Adapted winning formats: Identified the formats driving growth in each niche and brought them to stalled channels to restart growth.","ranges":[],"blueRanges":[[0,23]],"boldRanges":[]},"nodes.zzz-jp-accounts.results.0.metric":{"text":"80M+","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.zzz-jp-accounts.results.0.en":{"text":"Organic views","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.zzz-jp-accounts.results.1.metric":{"text":"50K+","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.zzz-jp-accounts.results.1.en":{"text":"Followers, up 50%","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.zzz-jp-accounts.results.2.metric":{"text":"50%+","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.zzz-jp-accounts.results.2.en":{"text":"Lower cost per view","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.zzz-jp-accounts.results.added-2f6c9a13-7b4e-4d82-9e51-0a3b8c6d5f27.metric":{"text":"9/9","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.zzz-jp-accounts.results.added-2f6c9a13-7b4e-4d82-9e51-0a3b8c6d5f27.en":{"text":"Channels hitting view targets at handover","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.gip-testing.summary.en":{"text":"I designed and ran a three-round testing framework to see whether TikTok’s UGC incentive program could boost installs efficiently.","ranges":[],"blueRanges":[],"boldRanges":[]},"nodes.gip-testing.sections.1.items.0.en":{"text":"Designed the test framework: Built a three-round roadmap, setting each round’s payout model (CPM or CPA), markets, themes, budgets and success metrics against our UA benchmarks.","ranges":[],"blueRanges":[[0,27]],"boldRanges":[]},"nodes.gip-testing.sections.1.items.1.en":{"text":"Led campaign execution: Owned all three rounds end to end, from task setup and creator briefs to progress tracking, submission reviews and recaps.","ranges":[],"blueRanges":[[0,22]],"boldRanges":[]},"nodes.gip-testing.sections.1.items.2.en":{"text":"Raised content quality: Optimized creator task briefing, and flagged off-brief videos to free up the prize pool for better ones.","ranges":[],"blueRanges":[[0,22]],"boldRanges":[]},"nodes.gip-testing.sections.1.items.3.en":{"text":"Evaluated performance and drove the decision: Measured reach, CPI, user quality and content relevance against our UA benchmarks, then recommended stopping the program and shifting budget to creator ads for UA.","ranges":[],"blueRanges":[[0,44]],"boldRanges":[]},"nodes.xbox-launch.team.en":{"text":"Me (creative strategy), 1 media strategist, 2 creative producers and 1 agency partner","ranges":[],"blueRanges":[],"boldRanges":[]}}`),lists:{"nodes.ua-creative-strategy.sections.0.items":[`0`,`added-7f687ed3-9abd-4a33-b2c1-3a343066832a`],"nodes.ua-creative-strategy.sections.1.items":[`0`,`1`,`added-5b0f3c2e-8a1d-4f6b-9c7e-2d4a6f8b1e30`,`2`],"nodes.ua-creative-strategy.results":[`3`,`2`,`1`,`0`],"nodes.xbox-l the AI Marketing Dashboard`}},related:[`ai-workbench`]},{id:`xbox-launch`,team:{en:`Me (creative strategy), 1 media strategist, 2 creative producers and 1 agency partner`},type:`case`,period:`Nov 2024`,parent:`more-growth`,headline:{num:`+338%`,label:{en:`CTR vs the earlier benchmark`}},label:{en:`Xbox Launch Paid Campaign`},kicker:{en:`Genshin Impact · Meta, YouTube, TikTok, X`},context:{en:`Genshin Impact`},tags:[{en:`Meta`},{en:`YouTube`},{en:`TikTok`},{en:`X`}],markets:[`US`,`DE`,`FR`],summary:{en:`Structured a localized creative test around four value propositions to move console players from interest to landing-page action.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`For the Xbox launch, paid media needed to drive landing-page traffic, not just awareness. The goal was to improve CTR and identify which creative messages could move console players from interest to action across YouTube, X, Meta, and TikTok.`},{en:`The challenge was execution-heavy: our team had to turn existing brand materials into a large localized creative test while keeping platform specs, language needs, and approval requirements aligned.`}]},{title:{en:`What I did`,zh:`我做了什么`},items:[{en:`Built the test around four messages: open world, global community, cloud gaming across devices, free content.`},{en:`Adapted brand materials into 16 cuts, localized into 144 EN / FR / DE assets.`},{en:`Reviewed results by channel, region and message with Media Strategy.`}]}],results:[{metric:`+338%`,en:`CTR versus the earlier benchmark.`},{metric:`66%`,en:`lower CPC versus the earlier benchmark.`},{metric:`120M+`,en:`impressions across the campaign.`},{metric:`~700K`,en:`landing-page clicks across the campaign.`}],media:[{src:`media/xbox-launch/genshin-xbox-banner-en-qr-blurred.jpg`,thumbnail:`media/xbox-launch/genshin-xbox-thumb.jpg`,floating:!0,alt:{en:`Genshin Impact Xbox launch promotional visual — QR code blurred`}}]},{id:`influencer-activation`,team:{en:`Influencer Strategy & Execution (my role), Execution Support x2, Agency Partners x2`},type:`case`,parent:`more-growth`,headline:{num:`~3x`,label:{en:`engagement vs the prior paid benchmark, at ~40% lower cost`}},label:{en:`Influencer Activation Campaign`},kicker:{en:`Genshin Impact · X`},context:{en:`Genshin Impact`},tags:[{en:`X`}],markets:[`EN`,`JP`,`KR`],summary:{en:`Redesigned creator targeting for a flagship character campaign, shifting from broad amplification to creator-native content for core players.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`As Genshin became a more mature live-service title, recurring character campaigns on X were becoming harder to energize, especially in EN.`},{en:`An earlier activation showed that paid creator campaigns could help revive momentum, but its creator and content mix was too broad to consistently re-engage core players. Ahead of a major character launch, the challenge was to refresh the strategy: redesign creator targeting and content direction so the campaign felt native to X, useful to players, and connected to the hashtag activity and in-game reward-code flow.`}]},{title:{en:`What I did`,zh:`我做了什么`},items:[{en:`Prioritized mid-tier creators with clear content roles: fan art, gameplay, cosplay, comics, guides.`},{en:`Strengthened EN coverage while keeping JP momentum; briefed player-facing formats.`},{en:`Led budget, sourcing, timeline and approvals; benchmarked against the prior paid activation.`}]}],results:[{metric:`56`,en:`creators, 78 UGC pieces, 13M+ creator-led exposure, 8%+ engagement`},{metric:`~3x`,en:`benchmark engagement at ~40% lower exposure cost`}],media:[{alt:{en:`Creator content examples`}}]},{id:`gip-testing`,note:{en:`my framework

自然播放`},team:{en:`Me (social strategy), 2 Japanese-language content reviewers and 3 agency partners`},type:`case`,parent:`growth`,featured:!0,headline:{num:`80M+`,label:{en:`organic views across 9 channels`}},label:{en:`Zenless Zone Zero: JP Account Growth`},kicker:{en:`YouTube, X`},context:{en:`Zenless Zone Zero`},tags:[{en:`YouTube`},{en:`X`}],period:`2024 Q3 – 2025 Q2`,markets:[`JP`],summary:{en:`Took over an early-stage Japanese creator-account matrix and scaled it into a repeatable growth system before handover.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`Zenless Zone Zero was still in an early JP growth stage, and official brand channels alone were not enough to drive always-on discovery. The goal of the creator-account matrix was to build non-official discovery channels that felt native to YouTube and X, helped players understand the game, and kept player discussion active beyond campaign moments.`},{en:`The team had limited precedent for operating brand-managed, third-party-style creator accounts as growth channels in JP. When I took over the early-stage matrix, the challenge was to identify which account positions and content formats could grow, then turn scattered experiments into a repeatable growth system before handover.`}]},{title:{en:`What I did`,zh:`我做了什么`},items:[{en:`Set account positioning across guide, entertainment and lore lanes; closed weak directions.`},{en:`Ran performance reviews on hooks, topics, packaging and platform fit; redirected stalled accounts.`},{en:`Documented SOPs, KPI logic and routines for handover.`}]}],results:[{metric:`80M+`,en:`organic views`},{metric:`50K+`,en:`followers`},{metric:`50%`,en:`lower CPM`}],media:[{src:`media/zzz-jp-accounts/gentle-house.jpg`,thumbnail:`media/zzz-jp-accounts/gentle-house-thumb.jpg`,floating:!0,alt:{en:`Zenless Zone Zero — Gentle House character artwork`}}],diagram:{src:`media/zzz-jp-accounts/zzz-system-diagram.png`,alt:{en:`How the channels launched and grew: map the market, position channels, brief and produce, review, adapt winners, hand over`}}},{id:`genshin-en-accounts`,team:{en:`Growth Strategy Support & Content Review (my role), Growth Strategy Lead x1, Agency Partner x1`},type:`case`,parent:`more-growth`,headline:{num:`136%`,label:{en:`of view KPI on established accounts`}},label:{en:`Genshin Impact: EN Social Growth`},kicker:{en:`TikTok, YouTube`},context:{en:`Genshin Impact`},tags:[{en:`TikTok`},{en:`YouTube`}],period:`Q4 2023`,markets:[`NA`],summary:{en:`Helped refresh content direction for plateauing EN creator-style accounts and set lanes for three new ones.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`Genshin Impact used creator-style matrix accounts to keep players engaged outside official brand channels. These accounts distributed useful game content, maintained platform buzz between major campaigns, and created low-cost social reach for active players.`},{en:`The 5 established EN accounts I supported had already built audiences, but growth was slowing: formats were becoming repetitive, follower interest was weakening, and traffic rose around major game updates but softened in quieter periods. The goal was to refresh established account direction while helping 3 new accounts find clearer verticals and content directions, all while keeping CPM efficient.`}]}],results:[{metric:`5`,en:`established accounts: +45K followers, 21M new views, 136% of view KPI`},{metric:`3`,en:`new accounts: 19K followers, 14M views`}],media:[{src:`media/genshin-en-accounts/genshin-social-growth.jpg`,thumbnail:`media/genshin-en-accounts/genshin-social-growth-thumb.jpg`,floating:!0,alt:{en:`Genshin Impact artwork featuring Aether and Lumine`}}]},{id:`giveaway-campaign`,team:{en:`Campaign Lead & Strategy Owner (my role), Execution Support x2, Agency Partners x4`},type:`case`,parent:`more-growth`,headline:{num:`~900K`,label:{en:`in-game code redemptions, ~4x the goal`}},label:{en:`Giveaway & Cross-Platform Influencer Campaign`},kicker:{en:`Genshin Impact 5.0 · X, TikTok, Instagram`},context:{en:`Genshin Impact 5.0`},tags:[{en:`X`},{en:`TikTok`},{en:`Instagram`}],markets:[`NA`,`JP`],summary:{en:`Tested a third-party, reward-based giveaway with in-game codes as a measurable conversion layer.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`Regular community activations on official channels were repeatedly reaching the same core audience. For a major version launch, the team needed to explore new activation formats that could expand topic exposure, reach semi-active and lapsed players, and create measurable engagement beyond standard official-account posting.`},{en:`We wanted to test whether a more entertainment-oriented, lower-funnel social format could activate player participation and distribute in-game redemption codes through third-party communities. Even if the format did not fully work, the test would clarify what kind of incentive and participation mechanic could move players outside the official-channel loop.`}]}],results:[{metric:`33M+`,en:`impressions (56% above target); ~900K code redemptions (~4x goal)`},{en:`Learning: quote participation underperformed — platform-native, simple actions matter`}]},{id:`interactive-filter`,note:{en:`600M+ views`,zh:`6 亿+ 播放`},team:{en:`Filter Creative Development & Influencer Activation Support (my role), Campaign Lead x1, TikTok/Snapchat Platform Liaisons x2, Agency Partners x3`},type:`case`,parent:`more-growth`,headline:{num:`600M+`,label:{en:`global views, 600K+ submissions`}},label:{en:`Interactive Filter Campaign`},kicker:{en:`Genshin Impact 4.4 · TikTok, Snapchat`},context:{en:`Genshin Impact 4.4`},tags:[{en:`TikTok`},{en:`Snapchat`}],markets:[`JP`,`SEA`,`US`],summary:{en:`Helped shape two gesture-based filters and brief 70+ creators for the first Snapchat Lens expansion.`},sections:[{title:{en:`The Challenge`,zh:`项目挑战`},items:[{en:`To promote Lantern Rite and drive version buzz, Genshin needed interactive filters that could feel fes
